name: Production build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Test event and CMS content rules
        run: npm test
      - name: Build Cloudflare Worker and prerendered pages
        run: npm run build
      - name: Validate generated language and SEO output
        run: npm run validate:build
      - name: Validate static Worker deployment configuration
        run: npm run validate:deploy
