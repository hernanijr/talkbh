name: Production build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Temporary threshold: the current High finding is an unpatched ReDoS in
      # build-time picomatch (tracked in issue #24). Keep the full audit report
      # visible, but block Critical findings while upstream remediation is pending.
      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=critical
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Test event and CMS content rules
        run: npm test
      - name: Build Cloudflare Worker and prerendered pages
        run: npm run build
      - name: Validate generated language and SEO output
        run: npm run validate:build
      - name: Validate static Worker deployment configuration
        run: npm run validate:deploy
