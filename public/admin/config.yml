backend:
  name: turbo-github
  turbo_site_id: 63bc3ac0-e116-4c37-9e8d-a6d47b2010ac
  branch: main
  squash_merges: true

publish_mode: editorial_workflow
media_folder: public/images/community
public_folder: /images/community
locale: pt

site_url: https://talk.bh
display_url: https://talk.bh
logo_url: /images/brand/talk-bh-logo.webp

collections:
  - name: community
    label: Eventos e fotos
    files:
      - name: community
        label: Conteúdo da comunidade
        file: src/data/community-content.json
        format: json
        preview_path: /
        fields:
          - label: Próximos encontros
            name: meetups
            widget: list
            required: false
            summary: "{{fields.date}} · {{fields.venue}}"
            hint: "Adicione apenas eventos confirmados. A data e o horário são sempre no fuso de Belo Horizonte."
            fields:
              - { label: Título em português, name: title_pt, widget: string, required: true }
              - { label: Title in English, name: title_en, widget: string, required: true }
              - { label: Descrição em português, name: description_pt, widget: text, required: true }
              - { label: Description in English, name: description_en, widget: text, required: true }
              - { label: Data (AAAA-MM-DD), name: date, widget: string, required: true, hint: "Use AAAA-MM-DD, por exemplo 2027-04-18." }
              - { label: Slug da URL, name: slug, widget: string, required: false, hint: "Opcional. Se vazio, o site gera um slug a partir do título em português e da data; mantenha-o estável depois de publicar." }
              - { label: Horário de início (HH:MM), name: time, widget: string, required: true, hint: "Use HH:MM no fuso de Belo Horizonte." }
              - { label: Horário de término (HH:MM), name: end_time, widget: string, required: false, hint: "Opcional. Preencha apenas quando o horário previsto de término do encontro estiver confirmado. Não use o horário de fechamento do estabelecimento." }
              - { label: Valor da entrada (BRL), name: entry_price, widget: number, required: true, default: 0, value_type: float, min: 0 }
              - label: Situação
                name: status
                widget: select
                options:
                  - { label: Confirmado, value: scheduled }
                  - { label: Cancelado, value: cancelled }
                default: scheduled
              - { label: Local, name: venue, widget: string, required: true, default: Charada Savassi Cervejaria Artesanal }
              - { label: Endereço completo, name: address, widget: string, required: true, default: 'Rua Paraíba, 523 — Belo Horizonte, MG' }
              - { label: Cidade, name: city, widget: string, required: true, default: 'Belo Horizonte, Minas Gerais, Brasil' }
              - { label: Link do Google Maps, name: maps_url, widget: string, required: false }
              - { label: Substitui o encontro padrão desta semana?, name: replaces_default_schedule, widget: boolean, required: true, default: false, hint: "Ative em um evento especial que deve substituir a reunião semanal. Deixe desativado quando for um evento adicional." }
          - label: Agenda padrão recorrente
            name: recurring_schedule
            widget: object
            required: true
            collapsed: true
            hint: "Gera automaticamente um encontro por semana a partir da primeira ocorrência. Eventos especiais podem substituir a recorrência naquela semana."
            fields:
              - { label: Ativar encontro padrão recorrente, name: enabled, widget: boolean, required: true, default: true }
              - { label: Dia da semana (0=domingo, 3=quarta-feira), name: weekday, widget: number, required: true, default: 3, value_type: int, min: 0, max: 6 }
              - { label: Primeira ocorrência (AAAA-MM-DD), name: start_date, widget: string, required: true, default: '2026-11-25', hint: "A primeira ocorrência confirmada da agenda. A partir dela o sistema gera uma ocorrência a cada 7 dias." }
              - { label: Horário de início (HH:MM), name: time, widget: string, required: true, default: '18:30' }
              - label: Poster padrão do encontro semanal
                name: default_image
                widget: image
                required: false
                media_folder: /public/images/events
                public_folder: /images/events
                hint: "Imagem usada nas quartas-feiras quando não houver um evento especial com arte própria. Prefira WebP ou JPG otimizado; a arte será exibida inteira, sem recorte."
              - { label: Fuso horário, name: timezone, widget: string, required: true, default: 'America/Sao_Paulo' }
              - { label: Título em português, name: title_pt, widget: string, required: true, default: 'Talk BH — encontro semanal de conversação em inglês' }
              - { label: Title in English, name: title_en, widget: string, required: true, default: 'Talk BH — weekly English conversation meetup' }
              - { label: Descrição em português, name: description_pt, widget: text, required: true, default: 'Encontro semanal para praticar inglês em um ambiente leve e informal, conhecer pessoas e conversar. Pessoas de todos os níveis são bem-vindas.' }
              - { label: Description in English, name: description_en, widget: text, required: true, default: 'A weekly meetup to practice English in a relaxed, informal setting, meet people and chat. All levels are welcome.' }
              - { label: Valor da entrada (BRL), name: entry_price, widget: number, required: true, default: 0, value_type: float, min: 0 }
              - { label: Local, name: venue, widget: string, required: true, default: 'Charada Savassi Cervejaria Artesanal' }
              - { label: Endereço completo, name: address, widget: string, required: true, default: 'Rua Paraíba, 523 — Belo Horizonte, MG' }
              - { label: Cidade, name: city, widget: string, required: true, default: 'Belo Horizonte, Minas Gerais, Brasil' }
              - { label: Link do Google Maps, name: maps_url, widget: string, required: false, default: 'https://www.google.com/maps/search/?api=1&query=Charada+Savassi+Cervejaria+Artesanal%2C+Rua+Para%C3%ADba%2C+523%2C+Belo+Horizonte%2C+MG' }
          - label: Semanas sem encontro padrão
            name: schedule_exceptions
            widget: list
            required: false
            summary: "Semana de {{fields.date}}"
            hint: "Adicione a data da quarta-feira que não terá o encontro semanal. Isso suprime somente aquela ocorrência."
            fields:
              - { label: Data da ocorrência suprimida (AAAA-MM-DD), name: date, widget: string, required: true }
              - { label: Motivo (opcional), name: reason, widget: string, required: false }
          - label: Arte do próximo encontro
            name: next_meetup_poster
            widget: object
            required: false
            collapsed: true
            summary: "Evento em {{fields.event_date}}"
            hint: "Associe a arte à data exata do encontro. Quando essa data passar ou deixar de ser o próximo encontro, ela será ignorada automaticamente e o site usará a imagem padrão."
            fields:
              - { label: Data do encontro associado (AAAA-MM-DD), name: event_date, widget: string, required: true, hint: "Use AAAA-MM-DD, por exemplo 2026-11-17. A data deve corresponder exatamente à data do encontro." }
              - label: Imagem de divulgação
                name: image
                widget: image
                required: true
                media_folder: /public/images/events
                public_folder: /images/events
                hint: "Prefira WebP ou JPG otimizado. O site preserva a proporção original e exibe o cartaz inteiro, sem recortar."
          - label: Galeria de fotos
            name: gallery
            widget: list
            required: false
            summary: "{{fields.alt_pt}}"
            hint: "Galeria vazia fica oculta. Para publicar, adicione de 1 a 6 fotos reais, com autorização e descrições nos dois idiomas."
            fields:
              - { label: Foto, name: image, widget: image, required: true }
              - { label: Descrição acessível em português, name: alt_pt, widget: string, required: true }
              - { label: Accessible description in English, name: alt_en, widget: string, required: true }
              - { label: Autorização de uso confirmada, name: rights_confirmed, widget: boolean, required: true, default: false }
